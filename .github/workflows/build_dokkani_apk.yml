name: Build Dokkani Android (APK & AAB)

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح تشغيل البناء يدوياً من واجهة GitHub Actions في أي وقت

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. استنساخ الكود المصدري للمستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17) المتوافقة مع أحدث حزم أندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. استعادة ملف مفتاح التوقيع (debug.keystore) من التشفير
      - name: Restore Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Keystore restored successfully."
          fi

      # 4. إعداد وتفعيل Gradle مع التخزين المؤقت التلقائي (Cache)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. التأكد من وجود أداة gradlew ومنحها صلاحيات التنفيذ
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # 6. بناء ملف الـ APK الجاهز للتثبيت الفوري على الهواتف
      - name: Build Android APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # 7. رفع وتخزين ملف الـ APK الناتج كأصل متاح للتحميل الفوري (Artifacts)
      - name: Upload Dokkani APK
        uses: actions/upload-artifact@v4
        with:
          name: dokkani-pos-app
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
