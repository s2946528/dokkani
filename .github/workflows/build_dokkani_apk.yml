name: Build Dokkani Android (APK & AAB)

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح تشغيل البناء يدوياً من واجهة GitHub Actions

jobs:
  build:
    name: Build Release APK and App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. استنساخ الكود المصدري للمستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (Java Development Kit - OpenJDK 17) المتوافقة مع أحدث حزم أندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد وتثبيت حزمة Flutter SDK (نسخة مستقرة Stable)
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. التحقق من جاهزية بيئة التطوير وملحقات أندرويد
      - name: Check Flutter and Android Environment
        run: flutter doctor -v

      # 5. تنزيل وفحص التبعيات والمكتبات
      - name: Install Project Dependencies (flutter pub get)
        run: flutter pub get

      # 6. التحقق من سلامة وجودة الكود وتنسيقه البرمجي
      - name: Run Static Code Analysis (flutter analyze)
        run: flutter analyze

      # 7. بناء نسخة أندرويد القابلة للتثبيت المباشر (Release APK)
      # يتم بناء نسخة مجمعة شاملة fat-apk أو تقسيمها حسب المعالجات (arm64-v8a / armeabi-v7a)
      - name: Build Android Release APK
        run: flutter build apk --release

      # 8. بناء حزمة تطبيق جوجل بلاي (Android App Bundle - .aab)
      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release

      # 9. رفع وتخزين ملفات الـ APK في مستودع GitHub كأصول جاهزة للتحميل المباشر
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokkani-pos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      # 10. رفع وتخزين ملف الـ App Bundle (.aab) لرفعه على متجر Google Play
      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokkani-pos-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
